name: Android 6.0 Compatibility Release

on:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: write

concurrency:
  group: android6-compatibility-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.3.3-android6.1
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the validated master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check the release version
        id: version
        run: |
          set -euo pipefail
          if ! grep -q 'versionName = "1.3.3-android6.1"' mobile/build.gradle.kts; then
            echo "This workflow only publishes the Android 6.0 compatibility version."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          elif gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "The compatibility release already exists; preserving its APK and signature."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download APKs from the successful build
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: debug-apks-${{ github.event.workflow_run.head_sha }}
          path: validated-apks
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up APK verification tools
        if: steps.version.outputs.publish == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0

      - name: Verify and prepare the Android 6.0 APK
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          apk="validated-apks/mobile/build/outputs/apk/debug/mobile-debug.apk"
          test -f "${apk}"
          tools="${ANDROID_HOME}/build-tools/36.0.0"
          "${tools}/aapt" dump badging "${apk}" > apk-badging.txt
          grep -q "versionCode='1304' versionName='1.3.3-android6.1'" apk-badging.txt
          grep -q "sdkVersion:'23'" apk-badging.txt
          grep -q "native-code:.*'armeabi-v7a'" apk-badging.txt
          "${tools}/apksigner" verify --min-sdk-version 23 --verbose --print-certs "${apk}" > apk-signature.txt
          cat apk-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' apk-signature.txt
          mkdir -p release
          cp "${apk}" release/xcertplay-1.3.3-android6.1.apk
          (cd release && sha256sum xcertplay-1.3.3-android6.1.apk > xcertplay-1.3.3-android6.1.apk.sha256)
          cp apk-signature.txt release/xcertplay-1.3.3-android6.1-signature.txt
          cat > release-notes.md <<'NOTES'
          ## Android 6.0 适配版

          下载 `xcertplay-1.3.3-android6.1.apk`，适用于 Android 6.0（API 23）及以上的普通 Android 车机，包含 `armeabi-v7a`、`arm64-v8a`、`x86_64` 原生库。

          - 修复旧系统的 USB 收发、媒体与 TLS API 兼容问题。
          - Android 6–7 的无线连接使用手动热点，需要在系统中开启热点并在应用设置中填写热点信息。
          - 首次启动未填写热点信息时保留界面并提示进入设置。

          APK 来自该版本 master 提交通过测试、lint 和构建检查的 GitHub Actions 产物。适配代码另已通过 API 23 模拟器安装与启动验证；真实车机、iPhone 的 CarPlay 连接和音频仍需实机验证。

          **签名说明：** 本 APK 为 debug 构建。未配置正式签名密钥时，GitHub Actions 使用标准 debug 签名；证书摘要见附件。若与此前本地 APK 或原版应用签名不同，安装时需要先卸载旧版（会清除其设置）。此 Release 的 APK 不会被后续构建自动替换。
          NOTES
          printf '\nSource commit: `%s`\n' "${SOURCE_SHA}" >> release-notes.md

      - name: Publish the compatibility release
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release/* \
            --target "${SOURCE_SHA}" \
            --title "xcertplay 1.3.3-android6.1 · Android 6.0 适配版" \
            --notes-file release-notes.md
